name: Playwright CI

on:
  pull_request:
  push:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  e2e-smoke:
    name: E2E Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm -C tests exec playwright install --with-deps chromium

      - name: Prepare database
        run: |
          docker compose -f docker-compose-dev.yml up -d --wait
          cp server/.env.sample server/.env
          pnpm server:db:init

      - name: Select test command
        id: select_tests
        run: |
          if rg -n "@smoke" tests/e2e/specs > /dev/null; then
            echo 'command=pnpm -C tests exec playwright test --grep "@smoke" --workers=1' >> "$GITHUB_OUTPUT"
            echo 'selection=@smoke-tagged Playwright tests' >> "$GITHUB_OUTPUT"
          else
            echo 'command=pnpm -C tests exec playwright test e2e/specs/auth.spec.ts e2e/specs/board-creation.spec.ts e2e/specs/card-lifecycle.spec.ts --workers=1' >> "$GITHUB_OUTPUT"
            echo 'selection=core MVP E2E specs (auth, board creation, card lifecycle)' >> "$GITHUB_OUTPUT"
          fi

      - name: Start app and run Playwright smoke suite
        id: run_tests
        env:
          BROWSER: none
          CI: 'true'
        run: |
          pnpm exec start-server-and-test "pnpm start" http://localhost:3000 "${{ steps.select_tests.outputs.command }}"

      - name: Capture Docker logs
        if: always()
        run: docker compose -f docker-compose-dev.yml logs --no-color > docker-compose-dev.log

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: tests/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-service-logs
          path: docker-compose-dev.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop services
        if: always()
        run: docker compose -f docker-compose-dev.yml down -v

      - name: Write job summary
        if: always()
        run: |
          {
            echo '## Playwright CI'
            echo
            echo "- Result: \`${{ steps.run_tests.outcome }}\`"
            echo "- Package manager: \`pnpm\`"
            echo "- Node version: \`24\`"
            echo "- App startup: \`pnpm start\`"
            echo "- Database startup: \`docker compose -f docker-compose-dev.yml up -d --wait\`"
            echo "- Readiness check: \`start-server-and-test\` waited for \`http://localhost:3000\`"
            echo "- Test selection: ${{ steps.select_tests.outputs.selection }}"
            echo "- Playwright config: \`tests/playwright.config.ts\`"
            echo "- Report artifact: \`playwright-report\`"
            echo "- Test artifact: \`playwright-test-results\`"
          } >> "$GITHUB_STEP_SUMMARY"
